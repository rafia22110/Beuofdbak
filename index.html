<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover, user-scalable=yes" />
    <title>OculoFlow — Clinical Pupillometry & Neurofeedback</title>
    <meta name="description" content="OculoFlow — Closed-Loop Pupil-Feedback Neuro-Platform & 3-Way OKF Clinical Reports" />

    <!-- Web App Manifest for Android & Store Packaging (TWA/PWA/Capacitor) -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Android & Chrome WebApp Capabilities -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="OculoFlow" />
    <meta name="theme-color" content="#FBFBF9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090C" media="(prefers-color-scheme: dark)" />

    <!-- iOS Apple WebApp & App Store Capabilities -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OculoFlow" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-apple.svg" />
    <link rel="icon" type="image/svg+xml" sizes="192x192" href="/icon-192.svg" />
    <link rel="icon" type="image/svg+xml" sizes="512x512" href="/icon-512.svg" />

    <!-- Security & Device Capabilities -->
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
    <meta name="msapplication-TileColor" content="#FBFBF9" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- Editorial Typography Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500;700;900&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#FBFBF9] text-[#141413] antialiased selection:bg-stone-900 selection:text-[#FBFBF9] overscroll-none touch-manipulation">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
