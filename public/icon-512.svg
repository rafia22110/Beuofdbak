<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1F1F1E" />
      <stop offset="100%" stop-color="#0B0C0E" />
    </radialGradient>
    <radialGradient id="irisGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="60%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#312E81" />
    </radialGradient>
    <radialGradient id="goldGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#D4AF37" stroke-opacity="0.3" stroke-width="3" />

  <!-- Outer Orbital Neuro Feedback Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#6366F1" stroke-opacity="0.25" stroke-dasharray="8 12" stroke-width="2.5" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#D4AF37" stroke-opacity="0.35" stroke-dasharray="4 8" stroke-width="2" />

  <!-- Sclera / Eye Contour -->
  <path d="M 64 256 Q 256 120 448 256 Q 256 392 64 256 Z" fill="#141413" stroke="#FBFBF9" stroke-opacity="0.6" stroke-width="5" stroke-linejoin="round" />

  <!-- Iris -->
  <circle cx="256" cy="256" r="95" fill="url(#irisGrad)" filter="url(#glow)" />
  <circle cx="256" cy="256" r="95" fill="none" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.6" />

  <!-- Pupil (Neurofeedback target) -->
  <circle cx="256" cy="256" r="48" fill="#09090C" />
  <circle cx="256" cy="256" r="48" fill="none" stroke="#818CF8" stroke-width="2.5" stroke-opacity="0.8" />

  <!-- Specular Corneal Glint -->
  <circle cx="236" cy="236" r="14" fill="#FFFFFF" opacity="0.95" />
  <circle cx="280" cy="275" r="5" fill="#FFFFFF" opacity="0.6" />

  <!-- Golden Reticle Points -->
  <circle cx="256" cy="66" r="5" fill="url(#goldGrad)" />
  <circle cx="256" cy="446" r="5" fill="url(#goldGrad)" />
  <circle cx="66" cy="256" r="5" fill="url(#goldGrad)" />
  <circle cx="446" cy="256" r="5" fill="url(#goldGrad)" />
</svg>
